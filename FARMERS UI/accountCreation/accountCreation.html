  <div class="container">
    <form id="accountCreationForm" class="responsive-form" action="submitAccount.php" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
      <h2>CREATE ACCOUNT</h2>
      <hr>
      <h3>PART 2: Account Creation</h3>
    
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required>
        
      <label for="password">Password:</label>
      <div class="password-field">
        <input type="password" id="password" name="password" placeholder="Enter a strong password" required>
        <span onclick="togglePasswordVisibility('password', 'passwordIcon')" class="show-password-icon">
          <i id="passwordIcon" class="fas fa-eye"></i>
        </span>
      </div>
        
      <label for="confirmPassword">Confirm Password:</label>
      <div class="password-field">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
        <span onclick="togglePasswordVisibility('confirmPassword', 'confirmPasswordIcon')" class="show-password-icon">
          <i id="confirmPasswordIcon" class="fas fa-eye"></i>
        </span>
      </div>        

      <label for="profileImage">Profile Image:</label>
      <input type="file" id="profileImage" name="profileImage" accept="image/*" required>
        
      <hr>

      <div class="button-container">
        <button type="submit" class="btn btn-primary">Create Account</button>
        <button type="button" class="btn btn-secondary" onclick="confirmCancel()">Cancel</button>
      </div>
    </form>
  </div>

  <script src="accountCreation.js"></script>
