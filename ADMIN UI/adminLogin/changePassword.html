<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APGORRS - Change Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            olive: '#3b4918', 'olive-light': '#576f1b', 'olive-dark': '#2a3311',
            harvest: '#f7931e', 'harvest-dark': '#d97b0d',
            cream: '#fffcef', 'cream-dark': '#f5f5f0',
            gold: '#c8bd44', 'gold-light': '#ccc14f',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { background: #fffcef; }
    .field-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 2px solid rgba(59,73,24,0.15);
      background: #fff;
      color: #3b4918;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-input:focus {
      border-color: #f7931e;
      box-shadow: 0 0 0 4px rgba(247,147,30,0.12);
    }
  </style>
</head>
<body class="font-sans text-olive antialiased">
  <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-gold/20 p-8 sm:p-10">
      <h1 class="text-2xl font-serif font-bold text-olive mb-1">Update your password</h1>
      <p class="text-olive/60 text-sm mb-6">For security, admin passwords must be changed every 90 days. Please set a new password to continue.</p>

      <form id="changePasswordForm" action="submitChangePassword.php" method="POST" class="space-y-4">
        <div>
          <label for="currentPassword" class="block text-xs font-bold text-olive/50 uppercase tracking-widest mb-2">Current Password</label>
          <input type="password" id="currentPassword" name="currentPassword" required class="field-input" placeholder="Enter current password">
        </div>
        <div>
          <label for="newPassword" class="block text-xs font-bold text-olive/50 uppercase tracking-widest mb-2">New Password</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8" class="field-input" placeholder="At least 8 characters">
        </div>
        <div>
          <label for="confirmPassword" class="block text-xs font-bold text-olive/50 uppercase tracking-widest mb-2">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" class="field-input" placeholder="Re-enter new password">
        </div>
        <button type="submit" class="w-full bg-olive text-white py-4 rounded-xl font-bold text-base hover:bg-olive-light transition-all">
          Update Password
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('changePasswordForm').addEventListener('submit', function (e) {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        e.preventDefault();
        alert('New password and confirmation do not match.');
      }
    });
  </script>
</body>
</html>
